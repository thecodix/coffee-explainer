# Fly.io app for the Q&A API. `app` must be unique on Fly: change it if the name is taken.
app = "coffee-explainer-api"
primary_region = "fra"  # same region as the Neon database (AWS eu-central-1, Frankfurt)

[build]

[env]
  QA_ENABLED = "true"
  PER_IP_PER_MINUTE = "5"
  PER_IP_PER_DAY = "30"
  DAILY_QUOTA = "300"
  CORS_ORIGINS = "http://localhost:5173"
  # Secrets, set with `fly secrets set`: READER_DATABASE_URL, GROQ_API_KEY

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # stop when idle: pay only while answering
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"   # the embedding model needs ~0.5 GB resident
  cpu_kind = "shared"
  cpus = 1
